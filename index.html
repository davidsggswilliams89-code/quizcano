/* =========================================================
FIREBASE CONFIGURATION
========================================================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

getFirestore,
collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAnMxqDpdzgKEW1vkRSrLysT-0nu_vEf8Q",

authDomain:
"quizcano.firebaseapp.com",

projectId:
"quizcano",

storageBucket:
"quizcano.firebasestorage.app",

messagingSenderId:
"834135771491",

appId:
"1:834135771491:web:c9998944df72d14a7b2b56"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================================================
HIDDEN ADMIN LOGIN
QUIZCANO LOGO 7 CLICKS
========================================================= */

const gameIcon =
document.getElementById(
"gameIcon"
);


let adminClickCount =
0;


let adminClickTimer =
null;


if(gameIcon){

    gameIcon.addEventListener(
        "click",
        function(){

            adminClickCount++;


            clearTimeout(
                adminClickTimer
            );


            adminClickTimer =
            setTimeout(
                function(){

                    adminClickCount =
                    0;

                },
                3000
            );


            if(
                adminClickCount ===
                7
            ){

                window.location.href =
                "login.html";

            }

        }
    );

}


/* =========================================================
SECTION 03
QUIZ CATEGORY SCROLLER JAVASCRIPT
========================================================= */

const categoryContainer =
document.getElementById(
"categoryScroll"
);


function activateCategoryCards(){

    const categoryCards =
    document.querySelectorAll(
        ".category-card"
    );


    categoryCards.forEach(
        function(card){

            card.addEventListener(
                "click",
                function(){

                    categoryCards.forEach(
                        function(item){

                            item.classList.remove(
                                "active"
                            );

                        }
                    );


                    this.classList.add(
                        "active"
                    );


                    const categoryId =
                    this.getAttribute(
                        "data-id"
                    );


                    const categoryName =
                    this.getAttribute(
                        "data-name"
                    );


                    window.location.href =

                    `category.html?subcategoryId=${categoryId}&name=${encodeURIComponent(categoryName)}`;

                }
            );

        }
    );


    if(
        categoryCards.length >
        0
    ){

        categoryCards[0].classList.add(
            "active"
        );

    }

}


async function loadCategoriesFromFirebase(){

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "subCategories"
            )
        );


        categoryContainer.innerHTML =
        "";


        snapshot.forEach(
            function(docItem){

                const data =
                docItem.data();


                if(
                    data.parentCategory !==
                    "quizCategory"
                ){

                    return;

                }


                categoryContainer.innerHTML += `

                    <div
                    class="category-card"
                    data-id="${docItem.id}"
                    data-name="${data.name}">

                        <img
                        src="${data.banner}"
                        alt="${data.name}">

                    </div>

                `;

            }
        );


        activateCategoryCards();

    }

    catch(error){

        console.log(
            "Category Error:",
            error
        );

    }

}


loadCategoriesFromFirebase();


/* =========================================================
SECTION 04
TRENDING QUIZZES JAVASCRIPT
========================================================= */

const trendingQuizList =
document.getElementById(
"trendingQuizList"
);


async function loadTrendingQuizzes(){

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "subCategories"
            )
        );


        trendingQuizList.innerHTML =
        "";


        let quizNumber =
        1;


        snapshot.forEach(
            function(docItem){

                const data =
                docItem.data();


                if(
                    data.parentCategory !==
                    "popularQuiz"
                ){

                    return;

                }


                let numberClass =
                "";


                if(
                    quizNumber ===
                    1
                ){

                    numberClass =
                    "gold";

                }

                else if(
                    quizNumber ===
                    2
                ){

                    numberClass =
                    "silver";

                }

                else if(
                    quizNumber ===
                    3
                ){

                    numberClass =
                    "bronze";

                }


                trendingQuizList.innerHTML += `

                    <div
                    class="quiz-card">

                        <div
                        class="quiz-number ${numberClass}">

                            ${quizNumber}

                        </div>


                        <img
                        src="${data.banner}"
                        class="quiz-thumb"
                        alt="${data.name}">


                        <div
                        class="quiz-details">

                            <h3>

                                ${data.name}

                            </h3>

                        </div>


                        <button
                        class="play-btn"
                        onclick="window.location.href='category.html?subcategoryId=${docItem.id}&name=${encodeURIComponent(data.name)}'">

                            PLAY

                        </button>

                    </div>

                `;


                quizNumber++;

            }
        );

    }

    catch(error){

        console.log(
            "Trending Quiz Error:",
            error
        );

    }

}


loadTrendingQuizzes();

const prizeChallengeContainer =
document.getElementById(
"prizeChallengeContainer"
);


async function loadPrizeChallenge(){

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "prizeChallenge"
            )
        );


        prizeChallengeContainer.innerHTML =
        "";


        if(
            snapshot.empty
        ){

            prizeChallengeContainer.innerHTML = `

                <p
                style="
                text-align:center;
                color:#9CA3AF;
                padding:20px;
                ">

                    No Prize Challenge Available

                </p>

            `;


            return;

        }


        snapshot.forEach(
            function(docItem){

                const data =
                docItem.data();


                prizeChallengeContainer.innerHTML += `

                    <div
                    class="prize-challenge-card">


                        <img
                        src="${data.image}"
                        alt="${data.title}">


                        <h2>

                            ${data.title}

                        </h2>


                        <p>

                            ${data.description}

                        </p>


                        <button
                        onclick="window.location.href='quiz.html?quizId=${data.quizId}'">

                            ▶ PLAY QUIZ NOW

                        </button>


                    </div>

                `;

            }
        );

    }

    catch(error){

        console.log(
            "Prize Challenge Error:",
            error
        );

    }

}


loadPrizeChallenge();


</script></body></html>
